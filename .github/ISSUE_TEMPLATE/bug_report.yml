name: Bug report
description: 报告可复现的问题
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 请填写版本、Windows 版本，以及浏览器模式或桌面模式。
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除 API Key、论文文件、个人路径和其他敏感信息。
          required: true
