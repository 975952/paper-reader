<h1>图神经网络在分子性质预测中的应用</h1>
<p>摘要：本文提出了一种融合注意力机制的图神经网络模型，用于分子性质的端到端预测。实验结果表明，该模型在 QM9 数据集上的平均绝对误差降低了 12.4%。</p>
<p class="en">Abstract: We propose an attention-augmented graph neural network for end-to-end molecular property prediction. Experiments on QM9 reduce mean absolute error by 12.4%.</p>
<p>关键词：图神经网络；注意力机制；分子性质预测；深度学习</p>
